name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.0.1-RC1). Must already exist on the repo."
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          # Linux binaries link the runner's glibc; 22.04 keeps the floor at 2.35.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-${{ matrix.platform }}
          repository-cache: true

      - name: test
        run: bazel test -c opt //...

      - name: build
        run: bazel build -c opt //rust/conduit:conduit

      - name: package
        run: |
          set -euo pipefail
          mkdir -p out
          cp -L bazel-bin/rust/conduit/conduit out/conduit-${{ matrix.platform }}
          chmod +x out/conduit-${{ matrix.platform }}
          (cd out && shasum -a 256 conduit-${{ matrix.platform }} > conduit-${{ matrix.platform }}.sha256)

      - name: smoke
        env:
          BIN: out/conduit-${{ matrix.platform }}
          TAG: ${{ github.event_name != 'pull_request' && (inputs.tag || github.ref_name) || '' }}
        run: |
          set -euo pipefail
          version="$("$BIN" --version)"
          echo "$version"
          if [[ -n "$TAG" && "$version" != "conduit ${TAG#v}" ]]; then
            echo "::error::$BIN reports '$version', expected 'conduit ${TAG#v}'"
            exit 1
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            glibc="$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)"
            echo "max GLIBC symbol: $glibc"
            if [[ "$(printf '%s\n' "$glibc" 2.35 | sort -V | tail -1)" != 2.35 ]]; then
              echo "::error::$BIN needs glibc $glibc, above the 2.35 floor"
              exit 1
            fi
          else
            otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts/

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
