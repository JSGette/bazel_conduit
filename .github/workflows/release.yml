name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.0.1-RC1). Must already exist on the repo."
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          # Linux binaries link the runner's glibc; 22.04 keeps the floor at 2.35.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
          disk-cache: release-${{ matrix.platform }}
          repository-cache: true

      - name: test
        run: bazel test -c opt //...

      - name: build
        run: bazel build -c opt //rust/conduit:conduit

      - name: package
        run: |
          set -euo pipefail
          mkdir -p out
          cp -L bazel-bin/rust/conduit/conduit out/conduit-${{ matrix.platform }}
          chmod +x out/conduit-${{ matrix.platform }}
          (cd out && shasum -a 256 conduit-${{ matrix.platform }} > conduit-${{ matrix.platform }}.sha256)

      - name: smoke
        env:
          BIN: out/conduit-${{ matrix.platform }}
          TAG: ${{ github.event_name != 'pull_request' && (inputs.tag || github.ref_name) || '' }}
        run: |
          set -euo pipefail
          version="$("$BIN" --version)"
          echo "$version"
          if [[ -n "$TAG" && "$version" != "conduit ${TAG#v}" ]]; then
            echo "::error::$BIN reports '$version', expected 'conduit ${TAG#v}'"
            exit 1
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            glibc="$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)"
            echo "max GLIBC symbol: $glibc"
            if [[ "$(printf '%s\n' "$glibc" 2.35 | sort -V | tail -1)" != 2.35 ]]; then
              echo "::error::$BIN needs glibc $glibc, above the 2.35 floor"
              exit 1
            fi
          else
            otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conduit-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts/

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
