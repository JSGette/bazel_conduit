name: licenses

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install cargo-deny
        run: cargo install --locked cargo-deny@0.19.5

      - name: check licenses
        run: cargo deny --manifest-path rust/conduit/Cargo.toml check licenses
