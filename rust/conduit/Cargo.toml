[package]
name = "conduit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "BEP to OpenTelemetry trace converter"

[dependencies]
# Proto / gRPC
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"

# OTel
opentelemetry = { version = "0.27", features = ["logs"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "logs"] }
opentelemetry-stdout = { version = "0.27", features = ["logs"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
zstd = { version = "0.13", default-features = false }

# Prost toolchain plugins (only needed for Bazel proto gen)
protoc-gen-prost = "0.4"
protoc-gen-tonic = "0.4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
