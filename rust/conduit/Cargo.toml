[package]
name = "conduit"
version = "0.0.1-RC2"
edition = "2024"
rust-version = "1.93"
description = "BEP to OpenTelemetry trace converter"
license = "Apache-2.0"

[dependencies]
# Proto / gRPC
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
zstd = { version = "0.14", default-features = false }

# Prost toolchain plugins (only needed for Bazel proto gen)
protoc-gen-prost = "0.5"
protoc-gen-tonic = "0.5"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
